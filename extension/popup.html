<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Batch Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel-2:#f7f7f9; --border:#e6e7ef;
    --text:#171923; --muted:#6b7085;
    --accent:#6d5bf5; --accent-2:#a855f7; --accent-bg:#f1eefe; --accent-ring:rgba(109,91,245,0.18);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e0f14; --panel-2:#1e2029; --border:#2a2d3a;
      --text:#f1f2f6; --muted:#9296ab;
      --accent:#8b7bff; --accent-2:#c084fc; --accent-bg:#221f3d; --accent-ring:rgba(139,123,255,0.28);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;width:300px;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:16px;
  }
  h1{font-size:0.95rem;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--text);
    transition:border-color .15s, background .15s;
  }
  .opt:last-child{margin-bottom:0;}
  .opt:hover{border-color:var(--accent);background:var(--accent-bg);}
  .opt .ico{font-size:1.3rem;flex:none;line-height:1;margin-top:1px;}
  .opt .t{font-weight:700;font-size:0.87rem;margin-bottom:2px;}
  .opt .d{font-size:0.76rem;color:var(--muted);line-height:1.4;}
</style>
</head>
<body>
  <h1>🖼️ Image Batch Downloader</h1>
  <button class="opt" id="openApp">
    <div class="ico">📄</div>
    <div>
      <div class="t">Batch download from a sheet</div>
      <div class="d">Upload a spreadsheet with title + image URL columns and download a ZIP.</div>
    </div>
  </button>
  <button class="opt" id="openSearch">
    <div class="ico">🔎</div>
    <div>
      <div class="t">Search &amp; fetch by title</div>
      <div class="d">Upload a sheet with just titles — searches Google for each one and pulls the product image.</div>
    </div>
  </button>
<script src="popup.js"></script>
</body>
</html>
